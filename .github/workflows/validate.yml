name: validate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    # The Renovate image ships its own Node, so the runner's Node version does not matter.
    # The image user cannot write the runner workspace, so the job runs as root.
    container:
      image: ghcr.io/renovatebot/renovate:44.235.3@sha256:5ab865a8d9a730b07d41fb434110c3e97243dc8c21efb029c60f748d0523d292
      options: --user root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate every preset (strict)
        run: |
          files=$(git ls-files '*.json')
          echo "Validating:"; echo "$files" | sed 's/^/  - /'
          # --no-global: the files are presets and repo configuration, not the bot's global configuration.
          renovate-config-validator --strict --no-global $files
